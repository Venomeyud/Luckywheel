<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>三周年幸运大转盘</title>
    <style>
        /* 页面基本样式设置 */
        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        h1 { color: #333; margin-bottom: 20px; text-align: center;}
        .subtitle { color: #666; margin-bottom: 30px; text-align: center; font-size: 14px;}
        
        /* 转盘容器 */
        .wheel-container {
            position: relative;
            width: 320px;
            height: 320px;
            margin-bottom: 30px;
        }
        
        /* 转盘本体 */
        #wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 8px solid #fff;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            position: relative;
            overflow: hidden;
            transition: transform 4s cubic-bezier(0.25, 0.1, 0.25, 1); /* 控制转动动画曲线 */
        }
        
        /* 转盘扇形区域 - 使用CSS绘制 */
        .segment {
            position: absolute;
            width: 50%;
            height: 50%;
            background-color: pink;
            transform-origin: 100% 100%;
            clip-path: polygon(0 0, 100% 0, 100% 100%);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        /* 扇形颜色交替 */
        .segment:nth-child(odd) { background-color: #FFD1DC; }
        .segment:nth-child(even) { background-color: #AEEEEE; }

        /* 选项内容文字和图标调整 */
        .segment-content {
            position: absolute;
            left: 20%;
            top: 35%;
            transform: rotate(30deg); /* 文字角度修正 */
            text-align: center;
            width: 120px;
            font-size: 14px;
            font-weight: bold;
            color: #444;
        }
        .segment-icon { font-size: 28px; display: block; margin-bottom: 5px; }
        
        /* 指针 */
        #pointer {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 30px solid #FF4081;
            z-index: 10;
            filter: drop-shadow(0 2px 2px rgba(0,0,0,0.3));
        }
        
        /* 中心圆点 */
        .center-circle {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 50px;
            height: 50px;
            background-color: #fff;
            border-radius: 50%;
            z-index: 5;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        /* 按钮样式 */
        #spinBtn {
            padding: 15px 40px;
            font-size: 18px;
            background: linear-gradient(45deg, #FF4081, #FF9E80);
            color: white;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 64, 129, 0.4);
            transition: transform 0.2s;
        }
        #spinBtn:active { transform: scale(0.95); }
        #spinBtn:disabled { background: #ccc; cursor: not-allowed; box-shadow: none;}
        
        /* 弹窗样式 */
        #resultModal {
            display: none;
            position: fixed; z-index: 100; left: 0; top: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.5); align-items: center; justify-content: center;
        }
        .modal-content {
            background-color: #fff; padding: 30px; border-radius: 15px; text-align: center;
            width: 80%; max-width: 300px; animation: popIn 0.3s ease-out;
        }
        @keyframes popIn { from {transform: scale(0.8); opacity: 0;} to {transform: scale(1); opacity: 1;} }
        .closeBtn {
            margin-top: 20px; padding: 10px 25px; background-color: #FF4081; color: white;
            border: none; border-radius: 20px; cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>三周年礼物大放送 ❤️</h1>
    <div class="subtitle">亲爱的，你有5次机会，看看能抽中什么！</div>

    <div class="wheel-container">
        <div id="pointer"></div>
        <div id="wheel">
            <div class="segment" style="transform: rotate(0deg) skewY(-30deg);">
                <div class="segment-content" style="transform: skewY(30deg) rotate(15deg);">
                    <span class="segment-icon">💇‍♀️</span>戴森吹风机
                </div>
            </div>
            <div class="segment" style="transform: rotate(60deg) skewY(-30deg);">
                <div class="segment-content" style="transform: skewY(30deg) rotate(15deg);">
                    <span class="segment-icon">🎁❓</span>神秘大奖
                </div>
            </div>
            <div class="segment" style="transform: rotate(120deg) skewY(-30deg);">
                <div class="segment-content" style="transform: skewY(30deg) rotate(15deg);">
                    <span class="segment-icon">📷</span>拍立得相机
                </div>
            </div>
            <div class="segment" style="transform: rotate(180deg) skewY(-30deg);">
                <div class="segment-content" style="transform: skewY(30deg) rotate(15deg);">
                    <span class="segment-icon">💨</span>什么都没有
                </div>
            </div>
            <div class="segment" style="transform: rotate(240deg) skewY(-30deg);">
                <div class="segment-content" style="transform: skewY(30deg) rotate(15deg);">
                    <span class="segment-icon">🧸</span>Jellycat玩偶
                </div>
            </div>
            <div class="segment" style="transform: rotate(300deg) skewY(-30deg);">
                <div class="segment-content" style="transform: skewY(30deg) rotate(15deg);">
                    <span class="segment-icon">🥤</span>网红保温杯
                </div>
            </div>
            <div class="center-circle"></div>
        </div>
    </div>

    <button id="spinBtn">开始抽奖 (还有 5 次)</button>

    <div id="resultModal">
        <div class="modal-content">
            <h2 id="resultTitle"></h2>
            <p id="resultText" style="font-size: 18px; margin: 20px 0;"></p>
            <button class="closeBtn" onclick="closeModal()">好的</button>
        </div>
    </div>

    <script>
        let spinCount = 0; // 记录旋转次数
        const maxSpins = 5; // 最大旋转次数
        const wheel = document.getElementById('wheel');
        const spinBtn = document.getElementById('spinBtn');
        let currentRotation = 0; // 当前角度

        spinBtn.addEventListener('click', () => {
            if (spinCount >= maxSpins) return;

            spinCount++;
            spinBtn.disabled = true; // 旋转时禁用按钮
            spinBtn.innerText = `正在旋转...`;

            // --- 核心作弊逻辑 ---
            // 我们需要计算目标角度。指针指向上方(0度)。
            // 要让某个扇形停在指针下，需要将转盘旋转到负的角度。
            
            let targetAngle;
            let resultTextForModal;

            if (spinCount <= 4) {
                // 前4次：强制命中 "什么都没有" (位于 180-240度区域，中心在210度)
                // 需要旋转基本圈数 + 使得210度转到0度的位置
                targetAngle = 210; 
                resultTextForModal = "💨 哎呀！什么都没有抽到！\n再试一次，手气在后面！";
            } else {
                // 第5次：强制命中 "神秘大奖" (位于 60-120度区域，中心在90度)
                targetAngle = 90;
                resultTextForModal = "🎁❓ 天呐！你抽中了【神秘大奖】！\n快问男朋友是什么！(他好像准备好了)";
            }
            
            // 计算最终旋转角度：当前角度 + 多转几圈(5圈) + 目标角度偏移
            // 使用负数让它顺时针转，并最终停在目标位置
            let finalRotation = currentRotation - (360 * 5) - (targetAngle - (currentRotation % 360));

            // 如果计算导致反向旋转，修正一下
            if (finalRotation > currentRotation) {
                 finalRotation -= 360 * 6;
            }
            
            // 应用旋转
            wheel.style.transform = `rotate(${finalRotation}deg)`;
            currentRotation = finalRotation; // 更新当前角度

            // 动画结束后显示结果 (4秒后)
            setTimeout(() => {
                showModal(resultTextForModal);
                spinBtn.disabled = false;
                let remaining = maxSpins - spinCount;
                if (remaining > 0) {
                    spinBtn.innerText = `再抽一次 (还有 ${remaining} 次)`;
                } else {
                    spinBtn.innerText = `抽奖结束，快去领奖！`;
                    spinBtn.disabled = true;
                }
            }, 4000);
        });

        // 弹窗相关函数
        const modal = document.getElementById('resultModal');
        const resultText = document.getElementById('resultText');
        const resultTitle = document.getElementById('resultTitle');

        function showModal(text) {
            if (spinCount <= 4) {
                resultTitle.innerText = "遗憾离场...";
            } else {
                 resultTitle.innerText = "🎉🎉🎉 中大奖啦！ 🎉🎉🎉";
            }
            resultText.innerText = text;
            modal.style.display = 'flex';
        }

        function closeModal() {
            modal.style.display = 'none';
        }
    </script>
</body>
</html>
