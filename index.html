<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>三周年纪念日 汪雯专属礼物转盘</title>
    <style>
        /* --- 页面基本样式设置 --- */
        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            /* 📢 【重要】修改背景照片说明：
             下面这一行 background-image 是设置背景的地方。
             如果你想用本地照片拼接图，请把引号里的网址删掉，换成你图片的文件名（照片要和这个html文件放在一起）。
             例如：background-image: url('我的照片墙.jpg');
             如果嫌麻烦，也可以先用我这个占位图。
            */
            background-image: url('https://images.unsplash.com/photo-1516967124798-106562b3ae0f?q=80&w=1000&auto=format&fit=crop&ixlib=rb-4.0.3'); 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            /* 加一个半透明遮罩，让背景照片不喧宾夺主，文字更清晰 */
            backdrop-filter: blur(3px) brightness(0.9);
            
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        h1 { 
            color: #fff; /* 标题改成白色背景更突出 */
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            margin-bottom: 10px; 
            text-align: center; 
            font-size: 26px; 
            padding: 0 20px;
            line-height: 1.4;
        }
        .subtitle { 
            color: #f0f0f0; 
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
            margin-bottom: 30px; text-align: center; font-size: 16px;
        }
        
        /* 转盘容器 */
        .wheel-container {
            position: relative;
            width: 320px;
            height: 320px;
            margin-bottom: 30px;
             /* 给转盘加个底座光晕，更像礼物 */
            box-shadow: 0 0 30px rgba(255, 192, 203, 0.6);
            border-radius: 50%;
        }
        
        /* 转盘本体 */
        #wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 8px solid #fff;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.2);
            position: relative;
            overflow: hidden;
            transition: transform 4s cubic-bezier(0.25, 0.1, 0.25, 1);
        }
        
        /* 转盘扇形区域 */
        .segment {
            position: absolute;
            width: 50%;
            height: 50%;
            background-color: pink;
            transform-origin: 100% 100%;
            clip-path: polygon(0 0, 100% 0, 100% 100%);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        /* 扇形颜色交替 */
        .segment:nth-child(odd) { background-color: #FFB6C1; } /* 浅粉 */
        .segment:nth-child(even) { background-color: #FF69B4; } /* 热粉，对比度高一点 */

        /* 选项内容 */
        .segment-content {
            position: absolute;
            left: 20%;
            top: 25%; /* 稍微往上提一点给图片腾位置 */
            transform: rotate(30deg);
            text-align: center;
            width: 120px;
            font-size: 13px;
            font-weight: bold;
            color: #fff; /* 文字改白色 */
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
        }
        /* 真实图片样式设置 */
        .segment-img {
            width: 50px;
            height: 50px;
            object-fit: contain; /* 保持图片比例 */
            display: block;
            margin: 0 auto 5px auto;
            filter: drop-shadow(2px 2px 2px rgba(0,0,0,0.2));
        }
        
        /* 指针 */
        #pointer {
            position: absolute;
            top: -25px;
            left: 50%;
            transform: translateX(-50%);
            width: 50px;
            z-index: 10;
            filter: drop-shadow(0 4px 4px rgba(0,0,0,0.3));
        }
        
        /* 中心圆点 */
        .center-circle {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60px;
            height: 60px;
            background-color: #fff;
            border: 4px solid #FF69B4;
            border-radius: 50%;
            z-index: 5;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        /* 按钮样式 */
        #spinBtn {
            padding: 15px 45px;
            font-size: 20px;
            font-weight: bold;
            background: linear-gradient(45deg, #FF1493, #FF69B4);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(255, 20, 147, 0.6);
            transition: transform 0.2s, background 0.3s;
        }
        #spinBtn:active { transform: scale(0.95); background: linear-gradient(45deg, #FF69B4, #FF1493);}
        #spinBtn:disabled { background: #aaa; cursor: not-allowed; box-shadow: none; color: #eee;}
        
        /* 弹窗样式 */
        #resultModal {
            display: none;
            position: fixed; z-index: 100; left: 0; top: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.7); align-items: center; justify-content: center;
            backdrop-filter: blur(5px);
        }
        .modal-content {
            background: linear-gradient(135deg, #ffffff 0%, #fff0f5 100%); 
            padding: 30px; border-radius: 20px; text-align: center;
            width: 85%; max-width: 320px; animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            border: 4px solid #FFB6C1;
        }
        @keyframes popIn { from {transform: scale(0.5); opacity: 0;} to {transform: scale(1); opacity: 1;} }
        .closeBtn {
            margin-top: 25px; padding: 12px 30px; background-color: #FF1493; color: white;
            border: none; border-radius: 25px; cursor: pointer; font-size: 16px; font-weight: bold;
        }
    </style>
</head>
