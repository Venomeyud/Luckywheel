<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>三周年纪念日 汪雯专属礼物转盘</title>
    <style>
        /* --- 基础设置 --- */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif; /* iPhone 原生字体栈 */
            /* 背景图设置 */
            background-image: url('background.jpg'); 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
            color: #333;
        }

        /* 全局深色遮罩，让磨砂玻璃更明显 */
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(0, 0, 0, 0.2); /* 微微压暗背景，突出主体 */
            z-index: -1;
        }

        /* --- 磨砂玻璃卡片容器 --- */
        .glass-card {
            background: rgba(255, 255, 255, 0.65); /* 半透明白 */
            backdrop-filter: blur(20px); /* 核心：磨砂模糊效果 */
            -webkit-backdrop-filter: blur(20px); /* 兼容 iPhone Safari */
            border-radius: 30px;
            padding: 30px 20px;
            width: 90%;
            max-width: 380px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15); /* 柔和投影 */
            border: 1px solid rgba(255, 255, 255, 0.6); /* 玻璃边缘高光 */
        }

        h1 { 
            color: #1d1d1f; /* 苹果深灰 */
            margin: 0 0 10px 0; 
            text-align: center; 
            font-size: 26px; 
            font-weight: 700;
            line-height: 1.3;
            letter-spacing: -0.5px;
        }
        .subtitle { 
            color: #6e6e73; 
            margin-bottom: 25px; 
            text-align: center; 
            font-size: 15px; 
            font-weight: 500;
        }
        
        /* --- 转盘容器 --- */
        .wheel-container {
            position: relative;
            width: 300px;
            height: 300px;
            margin-bottom: 30px;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.15)); /* 给整个转盘加投影 */
        }
        
        /* --- 转盘本体 --- */
        #wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            /* 轮廓明显：加粗的白色边框 + 外圈金属光泽 */
            border: 12px solid #fff; 
            box-sizing: border-box;
            position: relative;
            overflow: hidden;
            transition: transform 4s cubic-bezier(0.15, 0, 0.15, 1); /* iOS 风格的顺滑曲线 */
            background: #fff;
        }
        
        /* 扇形区域 */
        .segment {
            position: absolute;
            width: 50%;
            height: 50%;
            transform-origin: 100% 100%;
            clip-path: polygon(0 0, 100% 0, 100% 100%);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        /* 扇形配色 - 莫兰迪色系，更高级 */
        .segment:nth-child(odd) { background-color: #FFDEE9; background-image: linear-gradient(0deg, #FFDEE9 0%, #B5FFFC 100%); }
        .segment:nth-child(even) { background-color: #fff1eb; background-image: linear-gradient(0deg, #fff1eb 0%, #ace0f9 100%); }

        /* 选项内容 */
        .segment-content {
            position: absolute;
            left: 18%; 
            top: 35%;
            transform: rotate(30deg);
            text-align: center;
            width: 110px;
            font-size: 13px; /* 字体大小 */
            font-weight: 600; /* 字体加粗 */
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-shadow: 0 1px 0 rgba(255,255,255,0.5);
        }
        
        /* 图片样式 */
        .segment-image {
            width: 42px;
            height: 42px;
            object-fit: contain;
            margin-bottom: 6px;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1)); /* 图片立体感 */
            transform: rotate(-15deg); 
        }
        
        /* --- 指针 (重新设计，更明显) --- */
        #pointer {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            width: 40px;
            height: 50px;
            /* 使用 SVG 绘制一个更精致的指针 */
            background-image: url("data:image/svg+xml,%3Csvg width='40' height='50' viewBox='0 0 40 50' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M20 50L0 10C0 4.47715 4.47715 0 10 0H30C35.5228 0 40 4.47715 40 10L20 50Z' fill='%23FF2D55'/%3E%3Cpath d='M20 50L0 10C0 4.47715 4.47715 0 10 0H30C35.5228 0 40 4.47715 40 10L20 50Z' fill='url(%23paint0_linear)' fill-opacity='0.2'/%3E%3Cdefs%3E%3ClinearGradient id='paint0_linear' x1='20' y1='0' x2='20' y2='50' gradientUnits='userSpaceOnUse'%3E%3Cstop stop-color='white'/%3E%3Cstop offset='1' stop-color='black' stop-opacity='0'/%3E%3C/linearGradient%3E%3C/defs%3E%3C/svg%3E");
            background-repeat: no-repeat;
            background-size: contain;
            filter: drop-shadow(0 4px 4px rgba(0,0,0,0.3));
        }
        
        /* 中心圆点 */
        .center-circle {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 60px; height: 60px;
            background: white;
            border-radius: 50%;
            z-index: 5;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            display: flex; align-items: center; justify-content: center;
            font-size: 24px; 
            border: 4px solid #f2f2f7;
        }

        /* --- 按钮样式 (iOS 风格) --- */
        #spinBtn {
            width: 80%;
            padding: 16px 0;
            font-size: 17px;
            font-weight: 600;
            background: #007AFF; /* iOS 蓝 */
            color: white;
            border: none;
            border-radius: 14px; /* iOS 圆角风格 */
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(0, 122, 255, 0.3);
            transition: all 0.2s;
            margin-top: 10px;
        }
        #spinBtn:active { transform: scale(0.96); background: #0062cc; }
        #spinBtn:disabled { background: #E5E5EA; color: #8E8E93; cursor: not-allowed; box-shadow: none;}
        
        /* --- 弹窗样式 (磨砂质感) --- */
        #resultModal {
            display: none;
            position: fixed; z-index: 100; left: 0; top: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.4); 
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            align-items: center; justify-content: center;
        }
        .modal-content {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 30px 25px; 
            border-radius: 24px; 
            text-align: center;
            width: 70%; max-width: 300px; 
            animation: popIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 20px 50px rgba(0,0,0,0.2);
        }
        @keyframes popIn { from {transform: scale(0.8); opacity: 0;} to {transform: scale(1); opacity: 1;} }
        
        .closeBtn {
            margin-top: 20px; 
            padding: 12px 30px; 
            background: #FF2D55; /* iOS 粉红 */
            color: white; 
            border: none; 
            border-radius: 20px; 
            font-weight: 600;
            font-size: 16px;
            width: 100%;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <audio id="spinSound" preload="auto" loop>
        <source src="https://assets.mixkit.co/sfx/preview/mixkit-spinning-wheel-of-fortune-965.mp3" type="audio/mpeg">
    </audio>
    <audio id="winSound" preload="auto">
        <source src="https://assets.mixkit.co/sfx/preview/mixkit-winning-chimes-2015.mp3" type="audio/mpeg">
    </audio>
    <audio id="loseSound" preload="auto">
        <source src="https://assets.mixkit.co/sfx/preview/mixkit-cartoon-failure-piano-573.mp3" type="audio/mpeg">
    </audio>

    <div class="glass-card">
        <h1>三周年纪念日<br>汪雯专属礼物转盘</h1>
        <div class="subtitle">老婆大人，无限畅玩，直到满意为止 ❤️</div>

        <div class="wheel-container">
            <div id="pointer"></div>
            <div id="wheel">
                <div class="segment" style="transform: rotate(0deg) skewY(-30deg);">
                    <div class="segment-content" style="transform: skewY(30deg) rotate(15deg);">
                        <img src="https://img.alicdn.com/bao/uploaded/i4/2207692660945/O1CN0188939c20q6vXvQzXQ_!!2207692660945.jpg_300x300.jpg" class="segment-image" alt="戴森">
                        戴森吹风机
                    </div>
                </div>
                <div class="segment" style="transform: rotate(60deg) skewY(-30deg);">
                    <div class="segment-content" style="transform: skewY(30deg) rotate(15deg);">
                        <img src="https://cdn-icons-png.flaticon.com/512/6488/6488869.png" class="segment-image" alt="神秘大奖" style="filter: drop-shadow(0 0 5px gold);">
                        ✨神秘大奖✨
                    </div>
                </div>
                <div class="segment" style="transform: rotate(120deg) skewY(-30deg);">
                    <div class="segment-content" style="transform: skewY(30deg) rotate(15deg);">
                        <img src="https://img.alicdn.com/bao/uploaded/i2/2213578026652/O1CN01h11B112CJIxZqGzXx_!!2213578026652.jpg_300x300.jpg" class="segment-image" alt="拍立得">
                        拍立得相机
                    </div>
                </div>
                <div class="segment" style="transform: rotate(180deg) skewY(-30deg);">
                    <div class="segment-content" style="transform: skewY(30deg) rotate(15deg);">
                        <img src="https://cdn-icons-png.flaticon.com/512/416/416835.png" class="segment-image" alt="空气" style="opacity: 0.5;">
                        空气 (没礼物)
                    </div>
                </div>
                <div class="segment" style="transform: rotate(240deg) skewY(-30deg);">
                    <div class="segment-content" style="transform: skewY(30deg) rotate(15deg);">
                        <img src="https://img.alicdn.com/bao/uploaded/i3/2849132476/O1CN01a8899c1s511zXzXzX_!!2849132476.jpg_300x300.jpg" class="segment-image" alt="Jellycat">
                        Jellycat玩偶
                    </div>
                </div>
                <div class="segment" style="transform: rotate(300deg) skewY(-30deg);">
                    <div class="segment-content" style="transform: skewY(30deg) rotate(15deg);">
                        <img src="https://img.alicdn.com/bao/uploaded/i1/2200723576550/O1CN0188939c20q6vXvQzXQ_!!2200723576550.jpg_300x300.jpg" class="segment-image" alt="网红杯">
                        Stanley保温杯
                    </div>
                </div>
                <div class="center-circle">❤️</div>
            </div>
        </div>

        <button id="spinBtn">开始抽奖</button>
    </div>

    <div id="resultModal">
        <div class="modal-content">
            <h2 id="resultTitle" style="margin-top:0; font-size: 22px;"></h2>
            <div id="resultEmoji" style="font-size: 60px; margin: 15px 0;"></div>
            <p id="resultText" style="font-size: 17px; line-height: 1.5; color: #333; margin-bottom: 25px;"></p>
            <button class="closeBtn" onclick="closeModal()">知道了</button>
        </div>
    </div>

    <script>
        let spinCount = 0; 
        // 次数无限，不需要 maxSpins 限制了
        
        const wheel = document.getElementById('wheel');
        const spinBtn = document.getElementById('spinBtn');
        
        // 音效
        const spinSound = document.getElementById('spinSound');
        const winSound = document.getElementById('winSound');
        const loseSound = document.getElementById('loseSound');
        
        spinSound.volume = 0.5;
        winSound.volume = 0.8;
        loseSound.volume = 0.6;

        let currentRotation = 0; 

        spinBtn.addEventListener('click', () => {
            spinCount++;
            spinBtn.disabled = true;
            spinBtn.innerText = `正在旋转...`;

            // 播放转动音效
            spinSound.currentTime = 0;
            spinSound.play();

            let targetAngle;
            let resultTextForModal;
            let resultEmojiForModal;
            let isWin = false;

            if (spinCount <= 4) {
                // 前4次：强制命中 "空气" (210度位置)
                targetAngle = 210; 
                resultTextForModal = "哎呀！什么都没有抽到！<br><strong>老婆大人</strong>，再试一次，手气在后面！"; 
                resultEmojiForModal = "🥺💨";
                isWin = false;
            } else {
                // 第5次 及 以后所有次数：强制命中 "神秘大奖" (90度位置)
                // 只要到了第5次，以后怎么转都是大奖
                targetAngle = 90;
                resultTextForModal = "🎉 天呐！你抽中了【神秘大奖】！<br><strong>快问老公是什么！</strong><br>(这个礼物是你的了)";
                resultEmojiForModal = "🎁😍";
                isWin = true;
            }
            
            // 计算旋转逻辑 (防止角度累积过大导致动画失效，虽然CSS能处理很大数值，但为了无限玩，这里逻辑保持累加即可)
            // 每次多转 4-6 圈之间的随机数，增加真实感
            let randomSpins = Math.floor(Math.random() * 3) + 4; 
            let finalRotation = currentRotation - (360 * randomSpins) - (targetAngle - (currentRotation % 360));
            
            // 修正方向确保顺时针
            if (finalRotation > currentRotation) {
                 finalRotation -= 360 * (randomSpins + 1);
            }
            
            wheel.style.transform = `rotate(${finalRotation}deg)`;
            currentRotation = finalRotation; 

            // 4秒后显示结果
            setTimeout(() => {
                spinSound.pause();
                
                if (isWin) {
                    winSound.currentTime = 0;
                    winSound.play();
                    confettiEffect(); // 每次中奖都撒花
                } else {
                    loseSound.currentTime = 0;
                    loseSound.play();
                }

                showModal(isWin, resultTextForModal, resultEmojiForModal);
                
                spinBtn.disabled = false;
                
                // 按钮文案变化逻辑
                if (spinCount < 4) {
                    spinBtn.innerText = `再抽一次 (第 ${spinCount + 1} 次尝试)`;
                    spinBtn.style.background = "#007AFF"; // 蓝色
                } else if (spinCount === 4) {
                    spinBtn.innerText = `最后一次机会？(第 5 次)`;
                    spinBtn.style.background = "#FF9500"; // 橙色警示
                } else {
                    // 第5次以后
                    spinBtn.innerText = `再次回味中奖瞬间 ❤️`; 
                    spinBtn.style.background = "#34C759"; // 绿色成功
                }
                
            }, 4000);
        });

        const modal = document.getElementById('resultModal');
        const resultText = document.getElementById('resultText');
        const resultTitle = document.getElementById('resultTitle');
        const resultEmoji = document.getElementById('resultEmoji');
        const closeBtn = document.querySelector('.closeBtn');

        function showModal(isWin, text, emoji) {
            if (!isWin) {
                resultTitle.innerText = "遗憾离场...";
                resultTitle.style.color = "#8E8E93";
                closeBtn.style.background = "#8E8E93";
                closeBtn.innerText = "不服，再来！";
            } else {
                 resultTitle.innerText = "🎉 中大奖啦！ 🎉";
                 resultTitle.style.color = "#FF2D55";
                 closeBtn.style.background = "#FF2D55";
                 closeBtn.innerText = "开心收下";
            }
            resultText.innerHTML = text;
            resultEmoji.innerText = emoji;
            modal.style.display = 'flex';
        }

        function closeModal() {
            modal.style.display = 'none';
            winSound.pause();
            loseSound.pause();
        }

        // 撒花特效
        function confettiEffect() {
            const colors = ['#FF2D55', '#5856D6', '#FF9500', '#FFCC00', '#34C759'];
            for(let i=0; i<120; i++) {
                const confetti = document.createElement('div');
                confetti.style.position = 'fixed';
                confetti.style.width = Math.random() * 8 + 4 + 'px';
                confetti.style.height = Math.random() * 5 + 4 + 'px';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.top = -10 + 'px';
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.zIndex = 200;
                confetti.style.borderRadius = '2px';
                document.body.appendChild(confetti);

                const animation = confetti.animate([
                    { transform: `translate3d(0,0,0) rotate(0)`, opacity: 1 },
                    { transform: `translate3d(${Math.random()*100-50}px, 100vh, 0) rotate(${Math.random() * 720}deg)`, opacity: 0 }
                ], {
                    duration: Math.random() * 2000 + 1500,
                    easing: 'cubic-bezier(0.25, 1, 0.5, 1)'
                });
                animation.onfinish = () => confetti.remove();
            }
        }
    </script>
</body>
</html>
